function dOff(n){ var x=new Date(HOY); x.setDate(x.getDate()+n); return x; }
function pad2(n){ return (n<10?'0':'')+n; }
function fmtFecha(dt){ return pad2(dt.getDate())+'/'+pad2(dt.getMonth()+1)+'/'+dt.getFullYear(); }
function fmtFechaCorta(off){ var x=dOff(off); return pad2(x.getDate())+'/'+pad2(x.getMonth()+1); }
function crc(n){ return '₡'+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hh(n){ var x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); }

function estadoSocio(s){
  if(s.congelado) return 'congelado';
  if(s.vence < 0) return 'vencido';
  if(s.vence <= 7) return 'por vencer';
  return 'activo';
}
function pillEstado(e){
  var cls = e==='activo'?'p-ok': e==='por vencer'?'p-warn': e==='vencido'?'p-bad':'p-frz';
  return '<span class="pill '+cls+'"><span class="dot"></span>'+e.charAt(0).toUpperCase()+e.slice(1)+'</span>';
}

(function buildSocios(){
  SEED_SOCIOS.forEach(function(raw, i){
    var s = {
      id: 'S'+(1001+i),
      nombre: raw.n,
      tel: raw.tel,
      correo: raw.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(' ')[0]+'.'+
              raw.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(' ')[1]+'@correo.cr',
      plan: raw.plan,
      vence: raw.vence,
      saldo: raw.saldo,
      desde: raw.desde,
      nota: raw.nota,
      congelado: raw.congelado || false,
      pagos: [],
      asistencias: []
    };
    /* historial de pagos: periodos anteriores al vencimiento actual */
    var dias = PLANES[s.plan].dias, base = s.vence - dias;
    for(var k=0; k<4; k++){
      var off = base - dias*k;
      var metodos = ['Efectivo','SINPE Móvil','Tarjeta'];
      s.pagos.push({
        fecha: off,
        monto: k===0 ? PLANES[s.plan].p : PLANES[s.plan].p,
        metodo: metodos[Math.floor(hh(i*13+k)*3)],
        comp: 'CB-'+(270-i*4-k)
      });
    }
    /* asistencias de los últimos 30 días */
    var n = 9 + Math.floor(hh(i*7+2)*8);
    var usados = {};
    for(var j=0;j<n;j++){
      var off = -(Math.floor(hh(i*17+j)*29)+1);
      if(usados[off]) continue;
      usados[off]=1;
      var h = 6 + Math.floor(hh(i*23+j)*14);
      var m = Math.floor(hh(i*31+j)*4)*15;
      s.asistencias.push({off:off, hora:pad2(h)+':'+pad2(m)});
    }
    s.asistencias.sort(function(a,b){ return b.off-a.off; });
    STATE.socios.push(s);
  });
})();

/* ---------- Consultas agregadas ---------- */
function sociosValidos(){ return STATE.socios.filter(function(s){ return estadoSocio(s)!=='vencido' && estadoSocio(s)!=='congelado'; }); }
function sociosPorVencer(){ return STATE.socios.filter(function(s){ return estadoSocio(s)==='por vencer'; }).sort(function(a,b){return a.vence-b.vence;}); }
function sociosVencidos(){ return STATE.socios.filter(function(s){ return estadoSocio(s)==='vencido'; }).sort(function(a,b){return a.vence-b.vence;}); }
function totalPendiente(){ return STATE.socios.reduce(function(t,s){ return t + (s.saldo>0?s.saldo:0); }, 0); }
function ingresosDia(){ return STATE.pagosHoy.reduce(function(t,p){ return t+p.monto; }, 0); }
function totalRecuperado(){ return STATE.recuperadas.reduce(function(t,r){ return t+r.monto; }, 0); }
function avisosPendientes(){ return sociosPorVencer().filter(function(s){ return s.saldo<=0; }); }
function socioById(id){ return STATE.socios.filter(function(s){ return s.id===id; })[0]; }

function renderSocios(){
  var q = ($('#q-socios').value||'').toLowerCase().trim();
  var f = $('#f-estado').value;
  var list = STATE.socios.filter(function(s){
    var e = estadoSocio(s);
    if(f && e!==f) return false;
    if(!q) return true;
    return s.nombre.toLowerCase().indexOf(q)>=0 || s.tel.replace(/\s/g,'').indexOf(q.replace(/\s/g,''))>=0;
  });
  $('#socios-count').textContent = list.length + ' de ' + STATE.socios.length + ' socios';
  $('#tb-socios').innerHTML = list.length ? list.map(function(s){
    var e = estadoSocio(s);
    var vcls = e==='vencido' ? 'color:var(--bad);font-weight:700' : e==='por vencer' ? 'color:var(--warn);font-weight:700' : '';
    return '<tr onclick="openFicha(\''+s.id+'\')" style="cursor:pointer">'
      + '<td><span class="nm">'+esc(s.nombre)+'</span><span class="sub">'+s.id+' · desde '+fmtFechaCorta(s.desde)+'</span></td>'
      + '<td>'+PLANES[s.plan].n+'</td>'
      + '<td>'+pillEstado(e)+'</td>'
      + '<td class="mono" style="'+vcls+'">'+fmtFechaCorta(s.vence)+'<span class="sub">'+(s.vence<0?Math.abs(s.vence)+' días vencido':s.vence===0?'vence hoy':'en '+s.vence+' días')+'</span></td>'
      + '<td class="r mono" style="'+(s.saldo>0?'color:var(--bad);font-weight:700':'color:var(--gray)')+'">'+(s.saldo>0?crc(s.saldo):'—')+'</td>'

      + '<td class="r"><button class="btn tiny" onclick="event.stopPropagation();openFicha(\''+s.id+'\')">Ver ficha</button></td>'
      + '</tr>';
  }).join('') : '<tr><td colspan="7"><div class="empty">No se encontraron socios con ese criterio.</div></td></tr>';
}

    + '<div style="background:#f8fafd;border:1px solid var(--line);border-radius:11px;padding:11px">'
    + '<div style="font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gray)">Contacto</div>'
    + '<div style="font-size:15px;font-weight:800;margin-top:3px" class="mono">+506 '+s.tel+'</div>'
    + '<div style="font-size:11.5px;color:var(--gray);overflow:hidden;text-overflow:ellipsis">'+esc(s.correo)+'</div>'
    + '</div></div>'
    + '<div style="font-size:12px;color:var(--gray);background:#fff9e6;border:1px solid #f4e3ac;border-radius:10px;padding:10px;margin-bottom:15px">'
    + '<b style="color:#6d5200">Nota:</b> '+esc(s.nota)+'</div>'
    + '<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--gray);margin-bottom:7px">Historial de pagos</h4>'
    + '<div class="tw" style="margin-bottom:15px"><table style="min-width:380px"><thead><tr><th>Fecha</th><th>Comprobante</th><th>Método</th><th class="r">Monto</th></tr></thead><tbody>'
    + pagos.map(function(p){
        return '<tr><td class="mono">'+fmtFecha(dOff(p.fecha))+'</td><td class="mono" style="font-size:11.5px">'+p.comp+'</td><td>'+p.metodo+'</td><td class="r mono">'+crc(p.monto)+'</td></tr>';
      }).join('')
    + '</tbody></table></div>'
    + '<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--gray);margin-bottom:7px">Asistencias recientes</h4>'
    + '<div style="display:flex;flex-wrap:wrap;gap:6px">'
    + (asis.length ? asis.map(function(a){
        return '<span class="pill p-gray mono">'+DIAS[dOff(a.off).getDay()].slice(0,3)+' '+fmtFechaCorta(a.off)+' · '+a.hora+'</span>';
      }).join('') : '<span style="font-size:12px;color:var(--gray)">Sin asistencias registradas.</span>')
    + '</div>';

  $('#m-foot').innerHTML =
    '<button class="btn sm" onclick="closeModal()">Cerrar</button>'
    + '<button class="btn sm wa" onclick="maquetaWhatsApp(\''+s.id+'\')">Recordatorio WhatsApp</button>'
    + '<button class="btn sm" onclick="simularVencimiento(\''+s.id+'\')">Marcar vencido (demo)</button>'
    + (s.saldo>0 ? '<button class="btn sm primary" onclick="closeModal();prepararPago(\''+s.id+'\')">Cobrar saldo</button>' : '');
  openModal();
}

function simularVencimiento(id){
  var s = socioById(id);
  if(s.congelado){ toast('El socio está congelado.'); return; }
  if(s.vence < 0){ toast('Ese socio ya figura como vencido.'); return; }
  s.vence = -1; s.pagos = s.pagos.slice();
  closeModal();
  renderAll();
  toast(s.nombre.split(' ')[0] + ' pasó a estado vencido (demo).');
  go('vencimientos');
}

/* ---------- RENDER: VENCIMIENTOS ---------- */
function renderVencimientos(){
  var por = sociosPorVencer(), ven = sociosVencidos();
  $('#v-7').textContent = por.length;
  $('#v-7-sub').textContent = 'ingresos en riesgo: ' + crc(por.reduce(function(t,s){return t+PLANES[s.plan].p;},0));
  $('#v-venc').textContent = ven.length;
  $('#v-venc-sub').textContent = 'saldo por cobrar: ' + crc(ven.reduce(function(t,s){return t+s.saldo;},0));
  $('#v-avisos').textContent = avisosPendientes().length;
  $('#v-rec').textContent = STATE.recuperadas.length;
  $('#v-rec-sub').textContent = crc(totalRecuperado()) + ' recuperados';

  $('#lista-porvencer').innerHTML = por.length ? por.map(function(s){
    var urg = s.vence<=2;
    return '<div class="avrow">'
      + '<div class="who2"><b>'+esc(s.nombre)+'</b><small>'+PLANES[s.plan].n+' · +506 '+s.tel+' · vence '+fmtFechaCorta(s.vence)+'</small></div>'
      + '<span class="pill '+(urg?'p-bad':'p-warn')+'"><span class="dot"></span>'+s.vence+' día(s)</span>'
      + '<span class="days mono" style="min-width:88px">'+crc(PLANES[s.plan].p)+'</span>'
      + '<button class="btn tiny wa" onclick="maquetaWhatsApp(\''+s.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-12.7 7.3L3 20l1.3-5.1A8.5 8.5 0 1 1 21 11.5z"/></svg>Recordar</button>'
      + '</div>';
  }).join('') : '<div class="empty">No hay membresías por vencer en los próximos 7 días.</div>';

  $('#vencidos-hint').textContent = ven.length + ' socio(s) · aviso en rojo en recepción';
  $('#lista-vencidos').innerHTML = ven.length ? ven.map(function(s){
    return '<div class="avrow">'
      + '<div class="who2"><b>'+esc(s.nombre)+'</b><small>'+PLANES[s.plan].n+' · venció el '+fmtFechaCorta(s.vence)+' · +506 '+s.tel+'</small></div>'
      + '<span class="pill p-bad"><span class="dot"></span>'+Math.abs(s.vence)+' días</span>'
      + (s.saldo>0?'<span class="days mono" style="color:var(--bad)">'+crc(s.saldo)+'</span>':'<span class="days mono" style="color:var(--gray)">sin saldo</span>')
      + '<button class="btn tiny wa" onclick="maquetaWhatsApp(\''+s.id+'\')">Recordar</button>'
      + '<button class="btn tiny" onclick="simularRenovacion(\''+s.id+'\')">Renovar</button>'
      + '</div>';
  }).join('') : '<div class="empty">Ninguna membresía vencida. Todo al día.</div>';

  $('#rec-mes-label').textContent = MESES[HOY.getMonth()] + ' ' + HOY.getFullYear();
  $('#rec-lista').innerHTML = STATE.recuperadas.length ? STATE.recuperadas.map(function(r){
    return '<div class="avrow">'
      + '<div class="who2"><b>'+esc(r.nombre)+'</b><small>'+fmtFecha(dOff(r.fecha))+' · vía '+r.via+'</small></div>'
      + '<span class="pill p-ok"><span class="dot"></span>Recuperada</span>'
      + '<span class="days mono" style="min-width:88px">'+crc(r.monto)+'</span>'
      + '</div>';
  }).join('') : '<div class="empty">Todavía no hay renovaciones recuperadas este mes.</div>';
}

function simularRenovacion(id){
  var s = socioById(id);
  var dias = PLANES[s.plan].dias;
  s.vence = dias; s.saldo = 0;
  STATE.pagosHoy.push({
    hora: horaAhora(), socioId: s.id, nombre: s.nombre, monto: PLANES[s.plan].p,
    metodo: 'Efectivo', concepto: 'Renovación de membresía', comp: 'CB-'+(++STATE.comprobante)
  });
  STATE.recuperadas.unshift({socioId:s.id, nombre:s.nombre, fecha:0, monto:PLANES[s.plan].p, via:'Recepción', nota:'Renovó en recepción.'});
  renderAll();
  toast(s.nombre.split(' ')[0] + ' renovó. Se sumó a las recuperadas del mes.');
}
</script>
