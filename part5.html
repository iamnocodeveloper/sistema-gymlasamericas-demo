<script>
/* ---------- MODAL / TOAST ---------- */
function openModal(){ $('#scrim-m').classList.add('on'); $('#modal').classList.add('on'); }
function closeModal(){ $('#scrim-m').classList.remove('on'); $('#modal').classList.remove('on'); }
var toastT;
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); }, 3200);
}

/* ---------- RENDER: COBROS ---------- */
function renderCobros(){
  $('#c-ing').textContent = crc(ingresosDia());
  $('#c-ing-sub').textContent = STATE.pagosHoy.length + ' pagos · jornada de hoy';
  $('#c-pagos').textContent = STATE.pagosHoy.length;
  $('#c-pend').textContent = crc(totalPendiente());
  var nPend = STATE.socios.filter(function(s){ return s.saldo>0; }).length;
  $('#c-pend-sub').textContent = nPend + ' socio(s)';
  $('#c-comp').textContent = 'CB-' + STATE.comprobante;

  var sel = $('#pg-socio'), keep = sel.value;
  sel.innerHTML = STATE.socios.map(function(s){
    return '<option value="'+s.id+'">'+esc(s.nombre)+' · '+PLANES[s.plan].corto+(s.saldo>0?' · saldo '+crc(s.saldo):'')+'</option>';
  }).join('');
  if(keep) sel.value = keep;

  var pend = STATE.socios.filter(function(s){ return s.saldo>0; }).sort(function(a,b){ return b.saldo-a.saldo; });
  $('#pend-count').textContent = pend.length + ' socio(s) · ' + crc(totalPendiente());
  $('#lista-pendientes').innerHTML = pend.length ? pend.map(function(s){
    return '<div class="avrow">'
      + '<div class="who2"><b>'+esc(s.nombre)+'</b><small>'+PLANES[s.plan].n+' · vence '+fmtFechaCorta(s.vence)+'</small></div>'
      + '<span class="days mono" style="color:var(--bad);min-width:80px">'+crc(s.saldo)+'</span>'
      + '<button class="btn tiny primary" onclick="prepararPago(\''+s.id+'\')">Cobrar</button>'
      + '</div>';
  }).join('') : '<div class="empty">No hay saldos pendientes.</div>';

  $('#tb-mov').innerHTML = STATE.pagosHoy.length ? STATE.pagosHoy.slice().reverse().map(function(p){
    return '<tr><td class="mono">'+p.hora+'</td><td class="mono" style="font-size:11.5px">'+p.comp+'</td>'
      + '<td>'+esc(p.nombre)+'</td><td style="font-size:12px;color:var(--gray)">'+p.concepto+'</td>'
      + '<td><span class="pill '+(p.metodo==='Efectivo'?'p-gray':p.metodo==='SINPE Móvil'?'p-blue':'p-y')+'">'+p.metodo+'</span></td>'
      + '<td class="r mono" style="font-weight:700">'+crc(p.monto)+'</td></tr>';
  }).join('') : '<tr><td colspan="6"><div class="empty">Sin movimientos registrados hoy.</div></td></tr>';

  pgPreview();
}

function prepararPago(id){
  go('cobros');
  var sel=$('#pg-socio'); if(sel) sel.value = id;
  pgPreview();
  var card = $('#tour-cobros'); if(card) card.scrollIntoView({block:'center', behavior:'smooth'});
}

function pgPreview(){
  var el=$('#pg-resumen'); if(!el) return;
  var s = socioById($('#pg-socio').value) || STATE.socios[0];
  var monto = parseInt($('#pg-monto').value,10) || 0;
  var concepto = $('#pg-concepto').value;
  var saldoDespues = Math.max(0, s.saldo - monto);
  var venceDespues = s.vence;
  if(concepto==='Renovación de membresía'){
    venceDespues = Math.max(s.vence,0) + PLANES[s.plan].dias;
  }
  el.innerHTML = '<div style="font-size:12.5px;line-height:1.65">'
    + '<b>'+esc(s.nombre)+'</b><br>'
    + 'Plan '+PLANES[s.plan].n+' · vence hoy: '+fmtFechaCorta(s.vence)+'<br>'
    + 'Saldo actual: <b>'+crc(s.saldo)+'</b> · después del pago: <b style="color:'+(saldoDespues>0?'var(--bad)':'var(--ok)')+'">'+crc(saldoDespues)+'</b><br>'
    + 'Vencimiento nuevo: <b>'+fmtFechaCorta(venceDespues)+'</b></div>';
}

function registrarPago(){
  var s = socioById($('#pg-socio').value);
  var monto = parseInt($('#pg-monto').value,10) || 0;
  var metodo = $('#pg-metodo').value;
  var concepto = $('#pg-concepto').value;
  if(!s){ toast('Seleccione un socio.'); return; }
  if(monto < 1000){ toast('El monto mínimo es ₡1.000.'); return; }

  var saldoAntes = s.saldo, venceAntes = s.vence;
  var comp = 'CB-' + (++STATE.comprobante);
  var hora = horaAhora();

  s.saldo = Math.max(0, s.saldo - monto);
  if(concepto==='Renovación de membresía'){
    s.vence = Math.max(s.vence,0) + PLANES[s.plan].dias;
  }
  s.pagos.unshift({fecha:0, monto:monto, metodo:metodo, comp:comp});

  STATE.pagosHoy.push({hora:hora, socioId:s.id, nombre:s.nombre, monto:monto, metodo:metodo, concepto:concepto, comp:comp});

  renderAll();
  mostrarComprobante(s, {comp:comp, hora:hora, monto:monto, metodo:metodo, concepto:concepto, saldoAntes:saldoAntes, saldoDespues:s.saldo, venceAntes:venceAntes, venceDespues:s.vence});
  toast('Pago registrado · ' + comp + ' · ' + crc(monto));
}

function mostrarComprobante(s, d){
  $('#m-title').textContent = 'Comprobante de pago';
  $('#m-sub').textContent = 'Emitido a las ' + d.hora + ' · caja recepción';
  $('#m-body').innerHTML =
    '<div class="recibo">'
    + '<div class="rh"><b>GYM LAS AMÉRICAS HATILLO</b><small>Hatillo, San José, Costa Rica · WhatsApp +506 8841 9907</small>'
    + '<div style="margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.06em">'+d.comp+'</div></div>'
    + '<div class="rl"><span>Socio</span><b>'+esc(s.nombre)+'</b></div>'
    + '<div class="rl"><span>Identificador</span><b>'+s.id+'</b></div>'
    + '<div class="rl"><span>Concepto</span><b>'+d.concepto+'</b></div>'
    + '<div class="rl"><span>Método</span><b>'+d.metodo+'</b></div>'
    + '<div class="rl"><span>Fecha</span><b>'+fmtFecha(HOY)+' · '+d.hora+'</b></div>'
    + '<div class="rl"><span>Plan</span><b>'+PLANES[s.plan].n+'</b></div>'
    + '<div class="rl"><span>Saldo anterior</span><b>'+crc(d.saldoAntes)+'</b></div>'
    + '<div class="rl"><span>Saldo nuevo</span><b>'+crc(d.saldoDespues)+'</b></div>'
    + '<div class="rl"><span>Vencimiento</span><b>'+fmtFechaCorta(d.venceAntes)+' → '+fmtFechaCorta(d.venceDespues)+'</b></div>'
    + '<div class="rl tot"><span style="font-weight:700;color:var(--ink)">Total pagado</span><b>'+crc(d.monto)+'</b></div>'
    + '<div style="text-align:center;font-size:10.5px;color:var(--gray);margin-top:10px;border-top:1px dashed #d3dfec;padding-top:8px">Gracias por entrenar con nosotros.</div>'
    + '</div>'
    + '<div class="aviso info" style="margin:12px 0 0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><div>El saldo y el vencimiento del socio ya quedaron actualizados en el sistema.</div></div>';
  $('#m-foot').innerHTML =
    '<button class="btn sm" onclick="closeModal()">Cerrar</button>'
    + '<button class="btn sm" onclick="window.print()">Imprimir</button>'
    + '<button class="btn sm primary" onclick="closeModal();go(\'socios\')">Ver socios</button>';
  openModal();
}

/* ---------- WHATSAPP (maqueta) ---------- */
var WA_GYM = '50688419907';
function mensajeRecordatorio(s){
  var dias = s.vence;
  var cuerpo = dias < 0
    ? 'Le saludamos de Gym Las Américas Hatillo. Su membresía venció hace ' + Math.abs(dias) + ' día(s) y nos gustaría ayudarle a reactivarla.'
    : dias === 0
      ? 'Le saludamos de Gym Las Américas Hatillo. Su membresía vence hoy.'
      : 'Le saludamos de Gym Las Américas Hatillo. Su membresía vence en ' + dias + ' día(s).';
  return 'Hola ' + s.nombre.split(' ')[0] + ', ' + cuerpo + ' Su plan es ' + PLANES[s.plan].n + ' (' + crc(PLANES[s.plan].p) + '). Puede renovar en recepción o por SINPE Móvil al +506 8841 9907. ¡Le esperamos!';
}
function maquetaWhatsApp(id){
  var s = socioById(id);
  var msg = mensajeRecordatorio(s);
  var link = 'https://wa.me/' + WA_GYM + '?text=' + encodeURIComponent(msg);
  $('#m-title').textContent = 'Recordatorio por WhatsApp';
  $('#m-sub').textContent = 'Maqueta · no se envía ningún mensaje desde esta demo';
  $('#m-body').innerHTML =
    '<div style="font-size:12px;color:var(--gray);margin-bottom:8px">Para: <b style="color:var(--ink)">'+esc(s.nombre)+'</b> · +506 '+s.tel+'</div>'
    + '<div style="background:#e7ffdb;border-radius:12px 12px 12px 3px;padding:12px 13px;font-size:13px;line-height:1.55;border:1px solid #cbe9bd;max-width:100%;white-space:pre-wrap" id="wa-preview">'+esc(msg)+'</div>'
    + '<div class="aviso warn" style="margin:14px 0 0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2 20h20L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div><b>Maqueta.</b> El botón abre WhatsApp con el texto listo hacia el número del gimnasio (+506 8841 9907). No se envía nada automáticamente y el cliente no recibe mensajes desde esta demo.</div></div>';
  $('#m-foot').innerHTML =
    '<button class="btn sm" onclick="closeModal()">Cerrar</button>'
    + '<a class="btn sm wa" href="'+link+'" target="_blank" rel="noopener">Abrir en WhatsApp</a>'
    + '<button class="btn sm primary" onclick="marcarAvisado(\''+s.id+'\')">Marcar como avisado</button>';
  openModal();
}
function marcarAvisado(id){
  var s = socioById(id);
  closeModal();
  toast('Aviso registrado para ' + s.nombre.split(' ')[0] + ' (maqueta, sin envío).');
}
function enviarTodos(){
  var por = sociosPorVencer();
  var venc = sociosVencidos();
  var lista = por.concat(venc);
  $('#m-title').textContent = 'Avisos del día';
  $('#m-sub').textContent = lista.length + ' recordatorios listos · maqueta sin envío';
  $('#m-body').innerHTML = lista.length ? lista.map(function(s){
    return '<div class="avrow" style="padding:10px 0">'
      + '<div class="who2"><b>'+esc(s.nombre)+'</b><small>+506 '+s.tel+' · '+(s.vence<0?'vencida hace '+Math.abs(s.vence)+' días':'vence en '+s.vence+' días')+'</small></div>'
      + '<button class="btn tiny wa" onclick="closeModal();maquetaWhatsApp(\''+s.id+'\')">Ver mensaje</button></div>';
  }).join('') : '<div class="empty">No hay avisos por enviar.</div>';
  $('#m-foot').innerHTML = '<button class="btn sm" onclick="closeModal()">Cerrar</button>';
  openModal();
}

/* ---------- RENDER: ACCESO ---------- */
function renderAcceso(){
  var dentro = STATE.dentro;
  $('#a-count-pill').textContent = dentro.length;

  var vencidosDentro = dentro.filter(function(d){ return d.vencido; });
  $('#acceso-alerta').innerHTML = vencidosDentro.length
    ? '<div class="aviso bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2 20h20L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div><b>Entró un socio con membresía vencida:</b> '
      + vencidosDentro.map(function(d){ var s=socioById(d.socioId); return esc(s.nombre)+' ('+d.hora+')'; }).join(', ')
      + '. Pase a recepción para cobrar la renovación.</div></div>'
    : '';

  $('#lista-dentro').innerHTML = dentro.length ? dentro.map(function(d){
    var s = socioById(d.socioId);
    var mins = Math.max(1, Math.round((AHORA - (function(){ var t=horaAhora().split(':'); return 0; })()) / 60000));
    return '<div class="inrow'+(d.vencido?' bad':'')+'">'
      + '<div class="av2">'+inits(s.nombre)+'</div>'
      + '<div class="who3"><b>'+esc(s.nombre)+'</b><small>'+PLANES[s.plan].corto+' · entró '+d.hora+' · '+tiempoDentro(d.hora)+'</small></div>'
      + (d.vencido?'<span class="pill p-bad"><span class="dot"></span>Vencido</span>':'<span class="pill p-ok"><span class="dot"></span>Activo</span>')
      + '<button class="btn tiny" onclick="registrarSalida(\''+s.id+'\')">Salida</button>'
      + '</div>';
  }).join('') : '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/><path d="M10 8l4 4-4 4M14 12H3"/></svg>Nadie ha registrado entrada todavía.</div>';

  $('#a-total-hint').textContent = STATE.entradas.length + ' entradas hoy · ' + dentro.length + ' sin salida';
  $('#lista-entradas').innerHTML = STATE.entradas.length ? STATE.entradas.slice().reverse().map(function(x){
    var s = socioById(x.socioId);
    return '<div class="inrow"><div class="av2" style="background:#eef7f2;color:var(--ok)">'+inits(s.nombre)+'</div>'
      + '<div class="who3"><b>'+esc(s.nombre)+'</b><small>Entrada '+x.hora+'</small></div>'
      + '<span class="pill p-gray mono">'+x.hora+'</span></div>';
  }).join('') : '<div class="empty">Sin entradas registradas.</div>';

  renderAccesoBusqueda();
}

function tiempoDentro(hora){
  var p = hora.split(':'), a = AHORA.getHours()*60 + AHORA.getMinutes();
  var m = a - (parseInt(p[0],10)*60 + parseInt(p[1],10));
  if(m < 60) return m + ' min';
  return Math.floor(m/60) + ' h ' + (m%60) + ' min';
}

function renderAccesoBusqueda(){
  var el = $('#acceso-resultados'); if(!el) return;
  var q = ($('#q-acceso').value||'').toLowerCase().trim();
  var list = STATE.socios.filter(function(s){
    if(!q) return true;
    return s.nombre.toLowerCase().indexOf(q)>=0 || s.tel.replace(/\s/g,'').indexOf(q.replace(/\s/g,''))>=0;
  }).slice(0, 6);
  el.innerHTML = list.map(function(s){
    var e = estadoSocio(s);
    var dentro = STATE.dentro.some(function(d){ return d.socioId===s.id; });
    return '<div class="avrow" style="padding:9px 0">'
      + '<div class="who2"><b>'+esc(s.nombre)+'</b><small>'+pillEstado(e)+' · vence '+fmtFechaCorta(s.vence)+'</small></div>'
      + (dentro
          ? '<span class="pill p-blue">Ya está dentro</span>'
          : '<button class="btn tiny '+(e==='vencido'?'danger':'primary')+'" onclick="registrarEntrada(\''+s.id+'\')">'+(e==='vencido'?'Entrada (vencido)':'Registrar entrada')+'</button>')
      + '</div>';
  }).join('') || '<div class="empty" style="padding:16px">Sin coincidencias.</div>';
}

function registrarEntrada(id){
  var s = socioById(id);
  if(STATE.dentro.some(function(d){ return d.socioId===id; })){ toast('Ese socio ya está dentro.'); return; }
  var e = estadoSocio(s);
  var vencido = (e==='vencido' || e==='congelado');
  STATE.dentro.push({socioId:id, hora:horaAhora(), vencido:vencido});
  STATE.entradas.push({socioId:id, hora:horaAhora()});
  renderAll();
  if(vencido){
    toast('⚠ Entrada registrada con membresía ' + (e==='congelado'?'congelada':'vencida') + ': ' + s.nombre);
  } else {
    toast('Entrada registrada: ' + s.nombre.split(' ')[0] + ' ' + s.nombre.split(' ')[1] + ' · ' + horaAhora());
  }
}
function registrarSalida(id){
  STATE.dentro = STATE.dentro.filter(function(d){ return d.socioId!==id; });
  renderAll();
  toast('Salida registrada.');
}

/* ---------- RENDER: CLASES ---------- */

  {dia:0, hora:'18:00', n:'Pesas guiadas',    sala:'Sala de pesas',  coach:'Karla Rojas',   cupo:14, ins:14},
  {dia:1, hora:'07:00', n:'Ciclo indoor',     sala:'Estudio de ciclo', coach:'Mariela Solís', cupo:20, ins:12},
  {dia:1, hora:'19:00', n:'Funcional',        sala:'Sala funcional', coach:'Diego Mora',    cupo:18, ins:17},
  {dia:2, hora:'06:00', n:'Estiramiento',     sala:'Sala funcional', coach:'Laura Jiménez', cupo:16, ins:9},
  {dia:2, hora:'18:30', n:'Pesas guiadas',    sala:'Sala de pesas',  coach:'Karla Rojas',   cupo:14, ins:13},
  {dia:3, hora:'07:00', n:'Ciclo indoor',     sala:'Estudio de ciclo', coach:'Mariela Solís', cupo:20, ins:18},
  {dia:3, hora:'19:00', n:'Funcional',        sala:'Sala funcional', coach:'Diego Mora',    cupo:18, ins:11},
  {dia:4, hora:'06:00', n:'Funcional',        sala:'Sala funcional', coach:'Diego Mora',    cupo:18, ins:15},
  {dia:4, hora:'18:00', n:'Pesas guiadas',    sala:'Sala de pesas',  coach:'Karla Rojas',   cupo:14, ins:9},
  {dia:5, hora:'08:00', n:'Funcional sábado', sala:'Sala funcional', coach:'Laura Jiménez', cupo:22, ins:20},
  {dia:5, hora:'10:00', n:'Ciclo indoor',     sala:'Estudio de ciclo', coach:'Mariela Solís', cupo:20, ins:15},
  {dia:5, hora:'11:00', n:'Estiramiento',     sala:'Sala funcional', coach:'Laura Jiménez', cupo:16, ins:7}
];

function renderClases(){
  var totCupo=0, totIns=0;
  CLASES.forEach(function(c){ totCupo+=c.cupo; totIns+=c.ins; });
  $('#cl-n').textContent = CLASES.length;
  $('#cl-cupos').textContent = totCupo;
  $('#cl-res').textContent = totIns;
  $('#cl-ocu').textContent = Math.round(totIns/totCupo*100) + '%';
  $('#cl-pill').textContent = CLASES.length + ' clases · ' + totIns + '/' + totCupo + ' cupos';

  var nombresDia=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var hoyIdx = HOY.getDay()===0 ? -1 : HOY.getDay()-1;
  var out='';
  for(var d=0; d<6; d++){
    out += '<div class="daycol"><div class="dname">'+nombresDia[d]+(d===hoyIdx?' · hoy':'')+'</div>';
    CLASES.filter(function(c){ return c.dia===d; }).forEach(function(c){
      var pct = Math.round(c.ins/c.cupo*100);
      var cls = pct>=100 ? 'full' : pct>=85 ? 'warn' : '';
      out += '<div class="clase '+cls+'">'
        + '<div class="ct"><div><b>'+c.n+'</b><div class="ch">'+c.hora+' · '+c.sala+'</div></div>'
        + '<span class="pill '+(pct>=100?'p-bad':pct>=85?'p-warn':'p-ok')+'">'+pct+'%</span></div>'
        + '<div class="cbar"><i style="width:'+Math.min(100,pct)+'%"></i></div>'
        + '<div class="cf"><span>'+c.coach+'</span><span class="mono">'+c.ins+'/'+c.cupo+'</span></div>'
        + '</div>';
    });
    out += '</div>';
  }
  $('#agenda').innerHTML = out;
}

/* ---------- RENDER: INFORMES ---------- */
function svgOpen(w,h){ return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">'; }

function chartActivos(){
  var act = sociosValidos().length;
  var base = [12,14,15,17,18,18,20,21,22,23,24];
  var vals = base.concat([act]);
  var w=760,h=230, ml=38, mr=14, mt=14, mb=30;
  var maxV = Math.max.apply(null, vals);
  var top = Math.ceil((maxV+3)/5)*5;
  var iw = w-ml-mr, ih = h-mt-mb;
  var step = iw/(vals.length-1);
  var pts = vals.map(function(v,i){ return [ml+i*step, mt+ih-(v/top)*ih]; });
  var line = pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  var area = line + ' L'+pts[pts.length-1][0].toFixed(1)+' '+(mt+ih)+' L'+pts[0][0].toFixed(1)+' '+(mt+ih)+' Z';
  var grid='', labels='';
  for(var g=0; g<=4; g++){
    var y = mt+ih-(ih/4)*g;
    grid += '<line x1="'+ml+'" y1="'+y+'" x2="'+(w-mr)+'" y2="'+y+'" stroke="#e9eff7" stroke-width="1"/>';
    labels += '<text x="'+(ml-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#8496ab">'+Math.round(top/4*g)+'</text>';
  }
  var xl='';
  vals.forEach(function(v,i){
    var dt=new Date(HOY.getFullYear(), HOY.getMonth()-(vals.length-1-i), 1);
    if(i%2===0 || i===vals.length-1){
      xl += '<text x="'+pts[i][0].toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10" fill="#8496ab">'+MESES_C[dt.getMonth()]+'</text>';
    }
  });
  var dots = pts.map(function(p,i){
    var last = i===pts.length-1;
    return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(last?4.5:2.6)+'" fill="'+(last?'#ffc61a':'#12558f')+'" stroke="#fff" stroke-width="1.6"/>';
  }).join('');
  return svgOpen(w,h)
    + '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12558f" stop-opacity=".22"/><stop offset="1" stop-color="#12558f" stop-opacity="0"/></linearGradient></defs>'
    + grid + labels
    + '<path d="'+area+'" fill="url(#ga)"/>'
    + '<path d="'+line+'" fill="none" stroke="#12558f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
    + dots
    + '<text x="'+pts[pts.length-1][0].toFixed(1)+'" y="'+(pts[pts.length-1][1]-12).toFixed(1)+'" text-anchor="end" font-size="12.5" font-weight="800" fill="#0b2745">'+act+'</text>'
    + xl + '</svg>';
}

function chartPlanes(){
  var rows = Object.keys(PLANES).map(function(k){
    var n = STATE.socios.filter(function(s){ return s.plan===k && !s.congelado; }).length;
    var ing = STATE.socios.filter(function(s){ return s.plan===k && !s.congelado; })
      .reduce(function(t,s){ return t + PLANES[k].p; }, 0);
    return {k:k, nombre:PLANES[k].n, n:n, ing:ing};
  }).sort(function(a,b){ return b.ing-a.ing; });
  var max = Math.max.apply(null, rows.map(function(r){ return r.ing; })) || 1;
  var w=760, h=250, ml=132, mr=90, rowH=40, mt=8;
  var out = svgOpen(w,h);
  rows.forEach(function(r,i){
    var y = mt + i*rowH;
    var bw = Math.max(2, (r.ing/max)*(w-ml-mr));
    out += '<text x="0" y="'+(y+13)+'" font-size="11.5" font-weight="700" fill="#0d1c2e">'+esc(r.nombre)+'</text>'
      + '<text x="0" y="'+(y+27)+'" font-size="10" fill="#8496ab">'+r.n+' socio(s)</text>'
      + '<rect x="'+ml+'" y="'+(y+3)+'" width="'+(w-ml-mr)+'" height="16" rx="5" fill="#eef3f9"/>'
      + '<rect x="'+ml+'" y="'+(y+3)+'" width="'+bw.toFixed(1)+'" height="16" rx="5" fill="'+PLANES[r.k].color+'"/>'
      + '<text x="'+(w-2)+'" y="'+(y+16)+'" text-anchor="end" font-size="11.5" font-weight="800" fill="#0b2745">'+crc(r.ing)+'</text>';
  });
  out += '</svg>';
  return out;
}

function chartRenov(){
  var rec = STATE.recuperadas.length;
  var venc = sociosVencidos().length;
  var renov = [9,10,12,11,13,rec];
  var vencs = [6,7,5,8,7,venc];
  var w=760,h=250, ml=34, mr=12, mt=16, mb=30;
  var maxV = Math.max.apply(null, renov.concat(vencs));
  var top = Math.max(4, Math.ceil((maxV+1)/2)*2);
  var iw=w-ml-mr, ih=h-mt-mb;
  var group = iw/6, bw = Math.min(24, group*0.3);
  var out = svgOpen(w,h);
  for(var g=0; g<=4; g++){
    var y = mt+ih-(ih/4)*g;
    out += '<line x1="'+ml+'" y1="'+y+'" x2="'+(w-mr)+'" y2="'+y+'" stroke="#e9eff7"/>'
      + '<text x="'+(ml-7)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="#8496ab">'+Math.round(top/4*g)+'</text>';
  }
  for(var i=0;i<6;i++){
    var cx = ml + group*i + group/2;
    var dt = new Date(HOY.getFullYear(), HOY.getMonth()-(5-i), 1);
    var h1 = (renov[i]/top)*ih, h2 = (vencs[i]/top)*ih;
    out += '<rect x="'+(cx-bw-2)+'" y="'+(mt+ih-h1)+'" width="'+bw+'" height="'+h1+'" rx="3" fill="#0c7a52"/>'
      + '<rect x="'+(cx+2)+'" y="'+(mt+ih-h2)+'" width="'+bw+'" height="'+h2+'" rx="3" fill="#b3261e" opacity=".82"/>'
      + '<text x="'+cx+'" y="'+(h-8)+'" text-anchor="middle" font-size="10" fill="#8496ab">'+MESES_C[dt.getMonth()]+'</text>';
  }
  out += '</svg>';
  return out;
}

var AFORO = [16,44,61,58,31,24,27,33,30,38,57,79,86,64,35,14];

function chartHoras(){
  var w=760,h=240, ml=34, mr=12, mt=18, mb=28;
  var iw=w-ml-mr, ih=h-mt-mb;
  var maxV = Math.max.apply(null, AFORO);
  var top = Math.ceil((maxV+10)/20)*20;
  var bw = iw/AFORO.length;
  var out = svgOpen(w,h);
  for(var g=0; g<=4; g++){
    var y = mt+ih-(ih/4)*g;
    out += '<line x1="'+ml+'" y1="'+y+'" x2="'+(w-mr)+'" y2="'+y+'" stroke="#e9eff7"/>'
      + '<text x="'+(ml-7)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="#8496ab">'+Math.round(top/4*g)+'</text>';
  }
  var peak = AFORO.indexOf(maxV);
  AFORO.forEach(function(v,i){
    var bh = (v/top)*ih;
    var x = ml + i*bw + bw*0.2;
    var isPeak = i===peak;
    out += '<rect x="'+x.toFixed(1)+'" y="'+(mt+ih-bh).toFixed(1)+'" width="'+(bw*0.6).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="'+(isPeak?'#ffc61a':'#12558f')+'"/>'
      + '<text x="'+(x+bw*0.3).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="9.5" fill="#8496ab">'+(6+i)+'</text>';
    if(isPeak) out += '<text x="'+(x+bw*0.3).toFixed(1)+'" y="'+(mt+ih-bh-6).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="800" fill="#8a6500">'+v+'</text>';
  });
  out += '</svg>';
  return out;
}

function renderInformes(){
  var act = sociosValidos().length;
  var antes = 24;
  $('#inf-act-sub').textContent = (act>=antes?'+':'') + (act-antes) + ' socios vs. el mes pasado';
  $('#chart-activos').innerHTML = chartActivos();
  $('#chart-planes').innerHTML = chartPlanes() + '<div class="legend">'
    + Object.keys(PLANES).map(function(k){ return '<span><i style="background:'+PLANES[k].color+'"></i>'+PLANES[k].n+'</span>'; }).join('')
    + '</div>';
  $('#chart-renov').innerHTML = chartRenov() + '<div class="legend">'
    + '<span><i style="background:#0c7a52"></i>Renovaciones</span>'
    + '<span><i style="background:#b3261e"></i>Vencimientos</span></div>';
  $('#chart-horas').innerHTML = chartHoras();
  var peak = AFORO.indexOf(Math.max.apply(null,AFORO));
  $('#inf-hora-sub').textContent = 'Pico: ' + (6+peak) + ':00–' + (7+peak) + ':00 · promedio ' + AFORO[peak] + ' ingresos por día';
}

/* ---------- LANDING MINI ---------- */
function renderLanding(){
  $('#lp-activos').textContent = sociosValidos().length;
  $('#lp-vencen').textContent = sociosPorVencer().length;
  $('#lp-pend').textContent = crc(totalPendiente());
  $('#lp-ing').textContent = crc(ingresosDia());
  $('#lp-aviso-n').textContent = avisosPendientes().length + ' avisos';
  $('#lp-dentro-n').textContent = STATE.dentro.length + ' dentro';
  $('#lp-rec').textContent = STATE.recuperadas.length;
}

/* ---------- NAVEGACIÓN ---------- */
var SECCIONES = {
  panel:'Panel del día', socios:'Socios', vencimientos:'Vencimientos y avisos',
  cobros:'Cobros', acceso:'Acceso', clases:'Clases', informes:'Informes'
};
function go(sec){
  $$('.sec').forEach(function(s){ s.classList.remove('on'); });
  var el = document.getElementById('sec-'+sec);
  if(el) el.classList.add('on');
  $$('#nav button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-sec')===sec); });
  $('#crumb').textContent = 'Gym Las Américas · ' + (SECCIONES[sec]||'');
  $('#side').classList.remove('open');
  $('#scrim').classList.remove('on');
  window.scrollTo(0,0);
  if(sec==='panel') renderPanel();
  if(sec==='socios') renderSocios();
  if(sec==='vencimientos') renderVencimientos();
  if(sec==='cobros') renderCobros();
  if(sec==='acceso') renderAcceso();
  if(sec==='clases') renderClases();
  if(sec==='informes') renderInformes();
}
function toggleSide(){
  $('#side').classList.toggle('open');
  $('#scrim').classList.toggle('on');
}
function enterApp(){
  $('#landing').classList.add('out');
  $('#app').classList.add('on');
  renderAll();
}
function renderAll(){
  renderPanel(); renderSocios(); renderVencimientos(); renderCobros();
  renderAcceso(); renderClases(); renderInformes(); renderLanding();
  $('#today-label').textContent = capital(DIAS[HOY.getDay()]) + ', ' + HOY.getDate() + ' de ' + MESES[HOY.getMonth()] + ' de ' + HOY.getFullYear() + ' · jornada demo';
}
function capital(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* =========================================================
   RECORRIDO GUIADO · 8 PASOS
   ========================================================= */
var TOUR_STEPS = [
  {sec:'panel', target:'#tour-panel', title:'El panel del día',
   text:'Lo que hay que resolver hoy en una sola pantalla: cuántos socios están activos, cuántos vencen esta semana, cuánto hay pendiente de cobro y cuánto entró a caja. Abajo se ve quién está entrenando ahora y los avisos que faltan por enviar.'},
  {sec:'socios', target:'#tour-socios', title:'Los socios y su ficha',
   text:'La tabla se busca por nombre o teléfono y se filtra por estado: activo, por vencer, vencido o congelado. Cada fila muestra plan, vencimiento, saldo y contacto. Al abrir un socio aparece su historial de pagos y sus asistencias.'},
  {sec:'vencimientos', target:'#tour-vencimientos', title:'Vencimientos y avisos',
   text:'Ordenados por días restantes. Cada socio trae el botón para preparar el recordatorio por WhatsApp con el mensaje ya redactado, el monto del plan y el número del gimnasio. Es una maqueta: no se envía nada.'},
  {sec:'cobros', target:'#tour-cobros', title:'Registrar un cobro',
   text:'Se elige el socio, el monto y el método —efectivo, SINPE Móvil o tarjeta—. El sistema muestra cómo queda el saldo y el nuevo vencimiento antes de confirmar, y al registrar emite el comprobante con numeración correlativa.'},
  {sec:'acceso', target:'#tour-acceso', title:'El acceso al gimnasio',
   text:'Cada entrada queda con su hora y la lista de quién está dentro se actualiza al instante. Si entra alguien con la membresía vencida, la fila se marca en rojo y sale una alerta para que recepción cobre o renueve.'},
  {sec:'clases', target:'#tour-clases', title:'Las clases y su ocupación',
   text:'La agenda de lunes a sábado con hora, sala, entrenador y cupo. La barra muestra qué tan llena va cada clase: verde con espacio, ámbar casi llena y rojo sin cupo. Así se decide abrir otro horario o mover el entrenador.'},
  {sec:'informes', target:'#tour-informes', title:'Los informes',
   text:'Socios activos mes a mes, ingresos por plan, renovaciones contra vencimientos y la hora de mayor afluencia. Con esto se ve si el gimnasio crece, qué plan sostiene la caja y a qué hora hace falta más personal.'},
  {sec:'vencimientos', target:'#tour-recuperadas', title:'Las renovaciones recuperadas',
   text:'El resultado de avisar a tiempo: los socios que estaban por vencer o ya vencidos y renovaron después del recordatorio, con el monto recuperado y por qué vía volvieron. Es el número que justifica tener el control al día.'}
];
var tour = {active:false, i:0, auto:false, autoT:null, autoStart:0, tickT:null, lock:false};

function startTour(){
  enterApp();
  tour.active = true; tour.i = 0;
  $('#tour-close').style.display = 'block';
  var bt = $('#btn-tour'); if(bt) bt.style.visibility = 'hidden';
  showStep(0);
}
function endTour(silent){
  tour.active = false; stopAuto();
  $('#tour-spot').style.display='none';
  $('#tour-card').style.display='none';
  $('#tour-close').style.display='none';
  var bt=$('#btn-tour'); if(bt) bt.style.visibility='visible';
  if(!silent) toast('Recorrido finalizado. Puede repetirlo cuando quiera.');
}
function showStep(n){
  tour.i = Math.max(0, Math.min(TOUR_STEPS.length-1, n));
  var st = TOUR_STEPS[tour.i];
  closeModal();
  go(st.sec);
  tour.active = true;
  renderCard();
  requestAnimationFrame(function(){ setTimeout(placeStep, 60); });
}
function renderCard(){
  var st = TOUR_STEPS[tour.i], n = tour.i+1, tot = TOUR_STEPS.length;
  $('#tour-card').innerHTML =
      '<div class="step">Paso '+n+' de '+tot+'</div>'
    + '<h3>'+st.title+'</h3><p>'+st.text+'</p>'
    + '<div class="prog'+(tour.auto?' on':'')+'"><i id="tour-prog"></i></div>'
    + '<div class="navrow">'
    + '<button class="btn sm" onclick="prevStep()" '+(tour.i===0?'disabled':'')+'>Atrás</button>'
    + '<button class="btn sm primary" onclick="nextStep()">'+(tour.i===tot-1?'Finalizar':'Siguiente')+'</button>'
    + '<span class="sp"></span>'
    + '<button class="btn sm" onclick="toggleAuto()">'+(tour.auto?'Pausar':'Automático')+'</button>'
    + '<button class="btn sm" onclick="endTour()">Salir</button>'
    + '</div>';
  $('#tour-card').style.display = 'block';
}
function nextStep(){ if(tour.i >= TOUR_STEPS.length-1) endTour(); else showStep(tour.i+1); }
function prevStep(){ showStep(tour.i-1); }
function toggleAuto(){
  if(tour.auto){ stopAuto(); renderCard(); }
  else {
    tour.auto = true; tour.autoStart = Date.now();
    tour.autoT = setInterval(function(){
      if(tour.i >= TOUR_STEPS.length-1){ stopAuto(); renderCard(); return; }
      showStep(tour.i+1); tour.autoStart = Date.now();
    }, 7000);
    tour.tickT = setInterval(function(){
      var el=$('#tour-prog'); if(el) el.style.width = Math.min(100,(Date.now()-tour.autoStart)/7000*100)+'%';
    }, 100);
    renderCard();
  }
}
function stopAuto(){
  tour.auto = false;
  clearInterval(tour.autoT); clearInterval(tour.tickT);
  var el=$('#tour-prog'); if(el) el.style.width='0';
}
function placeStep(){
  if(!tour.active) return;
  var st = TOUR_STEPS[tour.i];
  var el = document.querySelector(st.target);
  var card = $('#tour-card');
  if(!el || el.offsetParent === null || el.getBoundingClientRect().height === 0){
    $('#tour-spot').style.display='none';
    card.style.width = Math.min(400, window.innerWidth-28)+'px';
    card.style.left = '14px';
    card.style.top = '74px';
    return;
  }
  var r = el.getBoundingClientRect(), pad = 8, sp = $('#tour-spot');
  var vw = window.innerWidth, vh = window.innerHeight;
  sp.style.display = 'block';
  sp.style.left = Math.max(4, r.left-pad)+'px';
  sp.style.top = Math.max(4, r.top-pad)+'px';
  sp.style.width = Math.min(r.width+pad*2, vw-8)+'px';
  sp.style.height = Math.min(r.height+pad*2, vh-8)+'px';
  var cw = Math.min(400, vw-28);
  var ch = card.offsetHeight || 230;
  var left = r.left;
  if(left+cw > vw-14) left = vw-cw-14;
  if(left < 14) left = 14;
  var top = r.bottom + 14;
  if(top+ch > vh-14) top = Math.max(14, r.top-ch-14);
  if(top < 8) top = 8;
  card.style.left = left+'px';
  card.style.top = top+'px';
  card.style.width = cw+'px';
}
window.addEventListener('resize', function(){ if(tour.active) placeStep(); });
window.addEventListener('scroll', function(){ if(tour.active) placeStep(); }, true);
document.addEventListener('keydown', function(e){
  if(!tour.active) return;
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); nextStep(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); prevStep(); }
  else if(e.key==='Escape'){ endTour(); }
});

/* ---------- INIT ---------- */
renderAll();
</script>
</body>
</html>
